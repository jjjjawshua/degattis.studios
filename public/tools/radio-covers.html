<style>
/* Layout: a studio tool — square cover on the left, a quiet control rail on the right, the edition series underneath. Single light look by choice. */
:root{
  --paper:#ecebf0; --paper-2:#f6f5f9; --ink:#221b29; --ink-2:#6a6275; --rule:rgba(34,27,41,.13);
  --accent:#d03a22; --vermilion:#e9553a; --white:#ffffff;
  --f-display:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.mono{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.wm{font-family:var(--f-display);font-weight:700;letter-spacing:-.055em;line-height:.86;text-transform:lowercase}
.wm sup,.logo-sup{font-size:.3em;font-weight:600;letter-spacing:0;vertical-align:top;position:relative;top:.06em;margin-left:.05em;line-height:1;text-transform:none}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:18px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
header .wm{font-size:24px}
header .wm span{font-weight:500;font-stretch:normal;letter-spacing:-.02em;color:var(--ink-2)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;margin-top:24px;align-items:start}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.cover{width:100%;aspect-ratio:1/1;max-width:100%;background:var(--paper-2);box-shadow:0 1px 0 rgba(0,0,0,.04),0 24px 60px -30px rgba(30,30,60,.35)}
.cover canvas{width:100%;height:100%;display:block}
.under{display:flex;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
.rail{display:grid;gap:22px;min-width:0}
.grp{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--rule)}
.grp:first-child{border-top:0;padding-top:0}
.field{display:grid;gap:6px}
.field label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
input[type=text],input[type=number]{font:500 15px/1.2 var(--f-body);padding:10px 12px;border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);border-radius:0;width:100%}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:110px 1fr;gap:10px}
.two.even{grid-template-columns:1fr 1fr}
.ctrl{display:grid;grid-template-columns:84px 1fr 34px;align-items:center;gap:12px}
.ctrl label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.ctrl output{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px/1 var(--f-body);padding:8px 12px;border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);border-radius:0;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,.ed:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 14px/1 var(--f-body);padding:12px 18px;border-radius:0;border:0;background:var(--accent);color:var(--white);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn[disabled]{opacity:.5;cursor:progress}
.note{font-size:13px;color:var(--ink-2);min-height:1.5em}
.series{margin-top:56px;border-top:1px solid var(--ink);padding-top:14px}
.series .head{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap;margin-bottom:18px}
.series h2{font-family:var(--f-display);font-weight:700;font-stretch:normal;letter-spacing:-.03em;font-size:clamp(24px,3vw,36px);margin:0;line-height:1}
.eds{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}
.ed{all:unset;cursor:pointer;display:grid;gap:8px;min-width:0}
.ed canvas{width:100%;aspect-ratio:1/1;display:block;background:var(--paper-2);outline:2px solid transparent;outline-offset:3px;transition:outline-color .15s}
.ed[aria-current=true] canvas{outline-color:var(--accent)}
.ed .nm{font:600 13px/1.25 var(--f-body)}
.saved{margin-top:20px;display:grid;gap:10px;justify-items:start}
.saved img{width:min(360px,100%);height:auto;display:block;box-shadow:0 10px 30px -18px rgba(30,30,60,.4)}
@media (max-width:1000px){ .eds{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:860px){ .main{grid-template-columns:1fr} .stage{position:static} }
@media (max-width:480px){ .eds{grid-template-columns:repeat(2,minmax(0,1fr))} .ctrl{grid-template-columns:72px 1fr 30px} }

.kmk{display:inline-block;flex:none;width:1.2em;height:1.2em}
.lock{display:inline-flex;align-items:center;gap:.14em}
.lock .kmk{width:.8em;height:.8em}
</style>

  chips('palChips', PKEYS.map(function(k){return [k, KS.PALETTES[k].name];}), 'palette');
  chips('inkChips', INKS, 'ink');
  var SL=[['count','Shapes',3,16,1],['size','Scale',.6,1.8,.01],['blur','Blur'],['streak','Smear'],['reed','Glass'],['veil','Fog'],['halftone','Halftone'],['grain','Grain']];
  var sw=document.getElementById('sliders');
  SL.forEach(function(s){
    var row=document.createElement('div'); row.className='ctrl';
    row.innerHTML='<label for="s-'+s[0]+'">'+s[1]+'</label><input type="range" id="s-'+s[0]+'" min="'+(s[2]||0)+'" max="'+(s[3]||1)+'" step="'+(s[4]||.01)+'"><output id="o-'+s[0]+'"></output>';
    sw.appendChild(row);
    var inp=row.querySelector('input'); inp.addEventListener('input', function(){ state[s[0]]=+inp.value; out(s); draw(); });
  });
  function out(s){ var v=state[s[0]]; document.getElementById('o-'+s[0]).textContent = s[0]==='count'?v:Math.round(v*100); }
  var F={ed:'edition',title:'title',date:'date',genre:'genre'};
  Object.keys(F).forEach(function(id){ var el=document.getElementById(id); el.addEventListener('input', function(){
    if(id==='ed'){ var n=Math.max(1,Math.min(999,parseInt(el.value,10)||1)); var keep={title:state.title}; state=editionState(n); sync(true); markSeries(); }
    else state[F[id]]=el.value;
    draw(); }); });
  function sync(fields){
    SL.forEach(function(s){ document.getElementById('s-'+s[0]).value=state[s[0]]; out(s); });
    [['layoutChips','layout'],['palChips','palette'],['inkChips','ink']].forEach(function(p){ document.querySelectorAll('#'+p[0]+' .chip').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.v===state[p[1]]); }); });
    if(fields!==false){ document.getElementById('title').value=state.title; document.getElementById('date').value=state.date; document.getElementById('genre').value=state.genre; if(document.activeElement!==document.getElementById('ed')) document.getElementById('ed').value=state.edition; }
  }
  document.getElementById('shuffleBtn').onclick=function(){ state.seed=(Math.random()*99999)|0; draw(); };
  var note=document.getElementById('note');
  document.getElementById('copyBtn').onclick=function(){
    var txt=JSON.stringify(state);
    try{ navigator.clipboard.writeText(txt).then(function(){ note.textContent='Settings copied.'; }, function(){ note.textContent=txt; }); }catch(e){ note.textContent=txt; }
  };

  // export
  var downloads=null;
  if (window.claude && window.claude.use) window.claude.use('downloads').then(function(d){ downloads=d; }, function(){});
  var eb=document.getElementById('exportBtn');
  eb.onclick=function(){
    eb.disabled=true; note.textContent='Rendering 3000 × 3000…';
    setTimeout(function(){
      var c=document.createElement('canvas'); c.width=c.height=3000;
      KS.create(c, artOpts(state)).render(0); drawType(c, state);
      c.toBlob(function(blob){
        eb.disabled=false;
        if(!blob){ note.textContent='Export failed in this browser. Try a smaller window or another browser.'; return; }
        var name='kram-radio-'+pad(state.edition)+'.png';
        if(downloads){
          downloads.save({filename:name, data:blob}).then(function(){ note.textContent='Saved '+name+'.'; }, function(e){
            if(e && e.code==='declined'){ note.textContent='Save cancelled.'; } else { showImage(blob, name); }
          });
        } else showImage(blob, name);
      }, 'image/png');
    }, 30);
  };
  function showImage(blob, name){
    var box=document.getElementById('saved'); box.hidden=false;
    box.innerHTML='<span class="mono">'+name+' · right-click or press and hold to save</span>';
    var img=new Image(); img.alt='Exported cover '+name; img.src=URL.createObjectURL(blob); box.appendChild(img);
    note.textContent='Your file is ready below.';
  }

  // series strip
  var eds=document.getElementById('eds'), edBtns=[];
  SERIES.forEach(function(s,i){
    var n=i+1, b=document.createElement('button'); b.className='ed'; b.type='button';
    b.innerHTML='<canvas aria-hidden="true"></canvas><span class="mono">Ed. '+pad(n)+'</span><span class="nm">'+s[0].replace('&','&amp;')+'</span>';
    b.addEventListener('click', function(){ state=editionState(n); sync(); draw(); markSeries(); window.scrollTo({top:0,behavior:'smooth'}); });
    eds.appendChild(b); edBtns.push(b);
  });
  function renderSeries(){ edBtns.forEach(function(b,i){ var c=b.querySelector('canvas'); var st=editionState(i+1); KS.fit(c,1.5); KS.create(c, artOpts(st)).render(0); drawType(c, st); }); }
  function markSeries(){ edBtns.forEach(function(b,i){ b.setAttribute('aria-current', state.edition===i+1); }); }

  sync(); markSeries();
  function all(){ draw(); renderSeries(); }
  var tm; window.addEventListener('resize', function(){ clearTimeout(tm); tm=setTimeout(all,150); });
  all();
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('700 40px "Inter Tight"'), document.fonts.load('600 40px "Inter Tight"'), document.fonts.load('500 20px "Inter Tight"')]).then(all, function(){});
})();
</script>
</body></html>
